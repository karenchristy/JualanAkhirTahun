<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Pesanan</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #1f5c45;
            color: white;
            padding: 25px;
        }

            header h1 {
                margin: 0;
            }

            header p {
                margin: 8px 0 0;
            }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

            .box h3 {
                margin-top: 0;
                color: #666;
            }

            .box strong {
                font-size: 25px;
            }

        .order {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
        }

        .customer {
            margin-top: 12px;
            line-height: 1.7;
        }

        .items {
            margin-top: 15px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .total {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
        }

        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .order-header {
                display: block;
            }

            select {
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- =========================
         LOGIN ADMIN
    ========================== -->

    <div id="loginPage" style="
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f5f5f5;
    ">

        <div style="
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        ">

            <h2 style="
                text-align: center;
                color: #1f5c45;
                margin-top: 0;
            ">
                🔐 Login Admin
            </h2>

            <p style="
                text-align: center;
                color: #666;
                margin-bottom: 25px;
            ">
                Dashboard Jualan Akhir Tahun
            </p>

            <input type="text"
                   id="adminUsername"
                   placeholder="Username"
                   style="
                    width: 100%;
                    padding: 12px;
                    margin-bottom: 15px;
                    border: 1px solid #ccc;
                    border-radius: 8px;
                ">

            <input type="password"
                   id="adminPassword"
                   placeholder="Password"
                   style="
                    width: 100%;
                    padding: 12px;
                    margin-bottom: 15px;
                    border: 1px solid #ccc;
                    border-radius: 8px;
                ">

            <button type="button" onclick="loginAdmin()"
                    style="
                    width: 100%;
                    padding: 12px;
                    border: none;
                    border-radius: 8px;
                    background: #1f5c45;
                    color: white;
                    font-size: 16px;
                    cursor: pointer;
                ">
                Masuk
            </button>

            <p id="loginError"
               style="
                    color: #c62828;
                    text-align: center;
                    margin-bottom: 0;
                "></p>

        </div>

    </div>
    <header style="display: none;">

        <h1>📋 Pesanan Masuk</h1>

        <p>
            Dashboard Jualan Akhir Tahun
        </p>

    </header>


    <div class="container" style="display: none;">

        <!-- DASHBOARD -->

        <div class="dashboard">

            <div class="box">

                <h3>Total Pesanan</h3>

                <strong id="totalOrders">
                    0
                </strong>

            </div>


            <div class="box">

                <h3>Pesanan Menunggu</h3>

                <strong id="waitingOrders">
                    0
                </strong>

            </div>


            <div class="box">

                <h3>Total Penjualan</h3>

                <strong id="totalSales">
                    Rp0
                </strong>

            </div>

        </div>


        <!-- DAFTAR PESANAN -->

        <div id="orders">

            <div class="empty">

                <h2>Belum ada pesanan</h2>

                <p>
                    Pesanan konsumen akan muncul di sini.
                </p>

            </div>

        </div>

    </div>


    <script>

        async function loadOrders() {

        try {

        const token = sessionStorage.getItem("adminToken");

        if (!token) {
        return;
        }

        const response = await fetch(
        "/api/orders",
        {
        headers: {
        "Authorization": "Bearer " + token
        }
        }
        );

        const data = await response.json();

        if (!data.success) {
        return;
        }

        const orders = data.orders;


        // TOTAL PESANAN

        document.getElementById("totalOrders")
        .textContent = orders.length;


        // PESANAN MENUNGGU

        const waiting = orders.filter(
        order => order.status === "Menunggu"
        ).length;

        document.getElementById("waitingOrders")
        .textContent = waiting;


        // TOTAL PENJUALAN

        const sales = orders
        .filter(
        order => order.status !== "Dibatalkan"
        )
        .reduce(
        (total, order) =>
        total + Number(order.total),
        0
        );

        document.getElementById("totalSales")
        .textContent = formatRupiah(sales);


        // DAFTAR PESANAN

        const container =
        document.getElementById("orders");


        if (orders.length === 0) {

        container.innerHTML = `
        <div class="empty">

        <h2>Belum ada pesanan</h2>

        <p>
        Pesanan konsumen akan muncul di sini.
        </p>

        </div>
        `;

        return;
        }


        container.innerHTML = orders.map(order => {

        const items = order.items.map(item => `

        <div class="item">

        <span>
        ${item.name}
        × ${item.quantity}
        </span>

        <span>
        ${formatRupiah(
        item.price * item.quantity
        )}
        </span>

        </div>

        `).join("");


        return `

        <div class="order">

        <div class="order-header">

        <div>

        <div class="order-number">
        ${order.order_number}
        </div>

        <small>
        ${formatDate(order.created_at)}
        </small>

        </div>


        <select
        onchange="
        updateStatus(
        ${order.id},
        this.value
        )
        "
        >

        <option
        ${order.status === "Menunggu"
        ? "selected"
        : ""}
        >
        Menunggu
        </option>

        <option
        ${order.status === "Diproses"
        ? "selected"
        : ""}
        >
        Diproses
        </option>

        <option
        ${order.status === "Selesai"
        ? "selected"
        : ""}
        >
        Selesai
        </option>

        <option
        ${order.status === "Dibatalkan"
        ? "selected"
        : ""}
        >
        Dibatalkan
        </option>

        </select>

        </div>


        <div class="customer">

        <strong>
        ${order.customer_name}
        </strong>

        <br>

        📱 ${order.whatsapp}

        ${
        order.note
        ? `<br>📝 ${order.note}`
        : ""
        }

        </div>


        <div class="items">

        ${items}

        </div>


        <div class="total">

        TOTAL:
        ${formatRupiah(order.total)}

        </div>

        </div>

        `;

        }).join("");


        } catch (error) {

        console.error(error);

        }

        }


        // ===============================
        // UBAH STATUS
        // ===============================

        async function updateStatus(id, status) {

        const token = sessionStorage.getItem("adminToken");

        if (!token) {
        return;
        }

        await fetch(
        `/api/orders/${id}/status`,
        {
        method: "PATCH",

        headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
        status: status
        })
        }
        );

        loadOrders();

        }
        // ===============================
        // FORMAT RUPIAH
        // ===============================

        function formatRupiah(number) {

        return new Intl.NumberFormat(
        "id-ID",
        {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
        }
        ).format(number);

        }


        // ===============================
        // FORMAT TANGGAL
        // ===============================

        function formatDate(date) {

        return new Date(date).toLocaleString(
        "id-ID",
        {
        dateStyle: "medium",
        timeStyle: "short"
        }
        );

        }


        // ===============================
        // JALANKAN
        // ===============================

        // Cek pesanan baru setiap 5 detik
        // Hanya berjalan jika admin sudah login

        setInterval(
        () => {

        const token =
        sessionStorage.getItem("adminToken");

        if (token) {
        loadOrders();
        }

        },
        5000
        );

    </script>

    <script>
        async function loginAdmin() {
        const username =
        document.getElementById("adminUsername").value;

        const password =
        document.getElementById("adminPassword").value;

        console.log("USERNAME:", username);
        console.log("PASSWORD TERISI:", password.length > 0);

        try {
        const response = await fetch(
        "/api/admin/login",
        {
        method: "POST",

        headers: {
        "Content-Type": "application/json"
        },

        body: JSON.stringify({
        username: username,
        password: password
        })
        }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
        alert(
        data.message ||
        "Username atau password salah."
        );
        return;
        }

        sessionStorage.setItem(
        "adminToken",
        data.token
        );

        location.reload();

        } catch (error) {

        console.error(error);

        alert(
        "Tidak dapat terhubung ke server."
        );
        }
        }
    </script>

    <script>
        function showAdminPage() {

        const token =
        sessionStorage.getItem("adminToken");

        if (!token) {
        return;
        }

        document.getElementById("loginPage").style.display = "none";

        document.querySelector("header").style.display = "block";

        document.querySelector(".container").style.display = "block";

        loadOrders();
        }

        showAdminPage();
    </script>

</body>
</html>
